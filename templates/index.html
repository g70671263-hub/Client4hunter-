<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Hunter Pro</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input, button { padding: 12px 16px; border-radius: 8px; border: none; font-size: 15px; }
        input { flex: 1; min-width: 200px; background: #1e293b; color: #fff; border: 1px solid #334155; }
        button { background: #0284c7; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
        
        /* OPTION 3: TAB FILTERS STYLING */
        .tabs-container { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 18px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 14px; }
        .tab-btn.active { background: #38bdf8; color: #0f172a; font-weight: bold; border-color: #38bdf8; }
        .tab-btn .count { background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 10px; margin-left: 6px; font-size: 12px; }

        .cache-badge { display: inline-block; background: #10b981; color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 15px; }
        
        .leads-grid { display: grid; gap: 15px; }
        .card { background: #1e293b; border-radius: 10px; padding: 18px; border: 1px solid #334155; position: relative; }
        .card.hot-lead { border: 2px solid #ef4444; background: #1c1017; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        .badge-hot { background: #ef4444; color: white; }
        .badge-maps { background: #0284c7; color: white; }
        .badge-other { background: #8b5cf6; color: white; }
        .title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #f1f5f9; }
        .desc { font-size: 14px; color: #cbd5e1; margin-bottom: 12px; line-height: 1.4; }
        .action-link { display: inline-block; color: #38bdf8; text-decoration: none; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Client Hunter Pro</h1>
    
    <div class="search-box">
        <input type="text" id="skillInput" placeholder="Skill (e.g. Web Development, SEO)">
        <input type="text" id="countryInput" placeholder="Country (e.g. Pakistan)">
        <button onclick="fetchLeads()">Search Leads</button>
    </div>

    <div id="cacheStatus"></div>

    <!-- OPTION 3: TAB FILTERS UI -->
    <div class="tabs-container" id="tabsContainer" style="display: none;">
        <button class="tab-btn active" onclick="filterLeads('all', this)">All Leads <span class="count" id="cntAll">0</span></button>
        <button class="tab-btn" onclick="filterLeads('hot', this)">🔥 Hot Clients <span class="count" id="cntHot">0</span></button>
        <button class="tab-btn" onclick="filterLeads('maps', this)">📍 Google Maps <span class="count" id="cntMaps">0</span></button>
        <button class="tab-btn" onclick="filterLeads('other', this)">🌐 Online Requests <span class="count" id="cntOther">0</span></button>
    </div>

    <div class="leads-grid" id="leadsGrid"></div>
</div>

<script>
    let allLeads = [];

    async function fetchLeads() {
        const skill = document.getElementById('skillInput').value || 'Web Development';
        const country = document.getElementById('countryInput').value || 'Pakistan';
        const grid = document.getElementById('leadsGrid');
        const cacheDiv = document.getElementById('cacheStatus');
        
        grid.innerHTML = '<p style="text-align:center; color:#94a3b8;">Fetching maximum local businesses & client requests...</p>';
        cacheDiv.innerHTML = '';

        try {
            const res = await fetch(`/api/leads?skill=${encodeURIComponent(skill)}&country=${encodeURIComponent(country)}`);
            const data = await res.json();
            
            allLeads = data.leads || [];

            if (data.is_cached) {
                cacheDiv.innerHTML = '<span class="cache-badge">⚡ Instant Cache Response (15-Min System Active)</span>';
            }

            // Update Counts in Tabs
            document.getElementById('cntAll').innerText = allLeads.length;
            document.getElementById('cntHot').innerText = allLeads.filter(l => l.is_hot).length;
            document.getElementById('cntMaps').innerText = allLeads.filter(l => l.lead_type === 'maps').length;
            document.getElementById('cntOther').innerText = allLeads.filter(l => l.lead_type === 'other').length;
            
            document.getElementById('tabsContainer').style.display = 'flex';
            
            // Render All leads by default
            renderCards(allLeads);
        } catch (err) {
            grid.innerHTML = '<p style="color:#ef4444; text-align:center;">Error fetching leads. Please try again.</p>';
        }
    }

    function renderCards(leads) {
        const grid = document.getElementById('leadsGrid');
        if (!leads || leads.length === 0) {
            grid.innerHTML = '<p style="text-align:center; color:#94a3b8;">No clients found in this category.</p>';
            return;
        }

        grid.innerHTML = leads.map(item => `
            <div class="card ${item.is_hot ? 'hot-lead' : ''}">
                <span class="badge ${item.is_hot ? 'badge-hot' : (item.lead_type === 'maps' ? 'badge-maps' : 'badge-other')}">
                    ${item.badge || item.platform}
                </span>
                <div class="title">${item.title}</div>
                <div class="desc">${item.description}</div>
                <a class="action-link" href="${item.action_link}" target="_blank">Open Client Listing ↗</a>
            </div>
        `).join('');
    }

    // TAB FILTERING LOGIC
    function filterLeads(category, element) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');

        if (category === 'all') {
            renderCards(allLeads);
        } else if (category === 'hot') {
            renderCards(allLeads.filter(l => l.is_hot));
        } else if (category === 'maps') {
            renderCards(allLeads.filter(l => l.lead_type === 'maps'));
        } else if (category === 'other') {
            renderCards(allLeads.filter(l => l.lead_type === 'other'));
        }
    }
</script>

</body>
</html>
